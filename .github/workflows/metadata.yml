name: MERIVUS Firmware Metadata

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  metadata:
    runs-on: ubuntu-latest
    container: px4io/px4-dev-base-focal:2021-09-08
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Generate firmware metadata
        run: |
          make airframe_metadata
          make module_documentation
          make parameters_metadata
          make extract_events
          ./Tools/uorb_graph/create.py --src-path src --exclude-path src/examples --exclude-path src/lib/parameters --merge-depends --file Tools/uorb_graph/graph_full
          ./Tools/uorb_graph/create.py --src-path src --exclude-path src/examples --exclude-path src/lib/parameters --exclude-path src/modules/mavlink --merge-depends --file Tools/uorb_graph/graph_full_no_mavlink

      - name: Collect metadata artifact
        run: |
          mkdir -p artifacts/docs artifacts/events artifacts/uorb
          cp -a build/px4_sitl_default/docs/. artifacts/docs/
          cp build/px4_sitl_default/events/all_events_full.json.xz artifacts/events/
          cp Tools/uorb_graph/graph_full.json Tools/uorb_graph/graph_full_no_mavlink.json artifacts/uorb/
          ./src/lib/version/get_git_tag_or_branch_version.sh build/px4_sitl_default > artifacts/source-version.txt

      - name: Upload firmware metadata
        uses: actions/upload-artifact@v7
        with:
          name: merivus-firmware-metadata
          path: artifacts
          if-no-files-found: error
